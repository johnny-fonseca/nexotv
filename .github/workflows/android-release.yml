name: Android Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Etiqueta SemVer que se publicará, por ejemplo v1.0.8"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Derive Android versions from tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "La etiqueta debe tener formato vMAJOR.MINOR.PATCH (ejemplo: v1.0.8)."
            exit 1
          fi

          MAJOR="${BASH_REMATCH[1]}"
          MINOR="${BASH_REMATCH[2]}"
          PATCH="${BASH_REMATCH[3]}"
          if (( MINOR >= 1000 || PATCH >= 1000 )); then
            echo "MINOR y PATCH deben ser menores que 1000 para esta fórmula de versionCode."
            exit 1
          fi

          VERSION_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          if (( VERSION_CODE < 1 || VERSION_CODE > 2100000000 )); then
            echo "El versionCode calculado excede el rango permitido por Google Play."
            exit 1
          fi

          VERSION_NAME="$MAJOR.$MINOR.$PATCH"
          echo "VERSION_CODE=$VERSION_CODE" >> "$GITHUB_ENV"
          echo "VERSION_NAME=$VERSION_NAME" >> "$GITHUB_ENV"
          {
            echo "### Versión de Android"
            echo "- Etiqueta: $RELEASE_TAG"
            echo "- versionName: $VERSION_NAME"
            echo "- versionCode: $VERSION_CODE"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install compile SDK
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0"

      - name: Restore release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.TVIPTV_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/nexotv-release.jks"
          echo "TVIPTV_RELEASE_STORE_FILE=$RUNNER_TEMP/nexotv-release.jks" >> "$GITHUB_ENV"

      - name: Build signed APKs and App Bundles
        env:
          TVIPTV_RELEASE_STORE_PASSWORD: ${{ secrets.TVIPTV_RELEASE_STORE_PASSWORD }}
          TVIPTV_RELEASE_KEY_ALIAS: ${{ secrets.TVIPTV_RELEASE_KEY_ALIAS }}
          TVIPTV_RELEASE_KEY_PASSWORD: ${{ secrets.TVIPTV_RELEASE_KEY_PASSWORD }}
        run: |
          bash ./gradlew --no-daemon \
            testTeleticaDebugUnitTest testFutvDebugUnitTest testOpaDebugUnitTest \
            assembleTeleticaRelease assembleFutvRelease assembleOpaRelease \
            bundleTeleticaRelease bundleFutvRelease bundleOpaRelease \
            -PreleaseVersionCode="$VERSION_CODE" \
            -PreleaseVersionName="$VERSION_NAME"

      - name: Check Google Play credentials
        id: play_config
        env:
          PLAY_UPLOAD_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        shell: bash
        run: |
          if [[ -n "$PLAY_UPLOAD_JSON" ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish APKs and AABs as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          ASSETS=(
            app/build/outputs/apk/teletica/release/*.apk
            app/build/outputs/apk/futv/release/*.apk
            app/build/outputs/apk/opa/release/*.apk
            app/build/outputs/bundle/teleticaRelease/*.aab
            app/build/outputs/bundle/futvRelease/*.aab
            app/build/outputs/bundle/opaRelease/*.aab
          )

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${ASSETS[@]}" \
              --title "NexoTV $RELEASE_TAG" \
              --verify-tag \
              --generate-notes
          fi

      - name: Upload Teletica AAB to Google Play internal testing
        if: steps.play_config.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: teletica.iptv.player
          releaseFiles: app/build/outputs/bundle/teleticaRelease/app-teletica-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ env.VERSION_NAME }}

      - name: Upload FUTV AAB to Google Play internal testing
        if: steps.play_config.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: teletica.iptv.player.futv
          releaseFiles: app/build/outputs/bundle/futvRelease/app-futv-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ env.VERSION_NAME }}

      - name: Upload OPA AAB to Google Play internal testing
        if: steps.play_config.outputs.configured == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: teletica.iptv.player.opa
          releaseFiles: app/build/outputs/bundle/opaRelease/app-opa-release.aab
          tracks: internal
          status: completed
          releaseName: ${{ env.VERSION_NAME }}

      - name: Report skipped Google Play upload
        if: steps.play_config.outputs.configured != 'true'
        shell: bash
        run: |
          echo "::warning::Falta el secreto PLAY_SERVICE_ACCOUNT_JSON; la carga a Google Play se omitió."
          echo "Los APK/AAB sí se publicaron como assets de GitHub Release. Configura PLAY_SERVICE_ACCOUNT_JSON para activar la carga interna a Play." >> "$GITHUB_STEP_SUMMARY"
