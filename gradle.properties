android.useAndroidX=true
kotlin.code.style=official
org.gradle.daemon=false
# compile-local.ps1 aplica --offline: evita acceso de Gradle a repositorios de red.
# Offline no deshabilita loopback: el Android Gradle Plugin puede usar workers aislados.
# org.gradle.daemon=false deshabilita el daemon persistente, no los procesos worker internos.
# Mantener estos argumentos idénticos a DEFAULT_JVM_OPTS de gradlew.bat y JAVA_OPTS de compile-local.ps1.
# Si difieren, Gradle puede crear un daemon de un solo uso incluso con --no-daemon, requiriendo loopback.
org.gradle.jvmargs=-XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -Xms512m -Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
org.gradle.caching=true
org.gradle.configuration-cache=false
# Evita reutilizar clases Kotlin inexistentes después de refactorizaciones.
# La compilación incremental estaba provocando errores de backend al intentar
# cargar MainMenuScreenSupportKt.class y otras clases eliminadas.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
kotlin.compiler.execution.strategy=in-process
org.gradle.vfs.watch=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=false
